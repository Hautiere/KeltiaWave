<!doctype html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <title>KeltiaWave Komz — Apprendre, parler, progresser</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b0f14" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- Police Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <app-root></app-root>
  <script>
    (() => {
      const hostname = window.location.hostname;
      const portalUrl = hostname === 'localhost' || hostname === '127.0.0.1'
        ? 'http://127.0.0.1:4100/'
        : hostname.endsWith('.staging.keltiawave.com')
          ? 'https://staging.keltiawave.com/'
          : 'https://keltiawave.com/';
      const alignPortalLinks = () => {
        document.querySelectorAll('a[href^="https://keltiawave.com"]')
          .forEach((link) => {
            const label = link.getAttribute('aria-label') || '';
            if (/keltiawave|portail/i.test(label)) link.setAttribute('href', portalUrl);
          });
      };
      new MutationObserver(alignPortalLinks).observe(document.body, { childList: true, subtree: true });
      alignPortalLinks();
    })();
  </script>
</body>
</html>

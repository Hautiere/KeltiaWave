name: KeltiaWave CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          SECRET_KEY: ci-only-secret-key
        run: python -m pytest -q

  frontend-builds:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [corpus, learning, record, transcribe, subtitles]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: npm run build

  portal-build:
    name: Validate portal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Validate static portal
        working-directory: apps/portal
        run: npm run build

  deployment-validation:
    name: Validate deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh
          bash -n deploy/ovh/*.sh

      - name: Prepare Compose-only environment
        run: |
          mkdir -p /tmp/keltiawave-ci-models
          cp deploy/ovh/.env.candidate.example /tmp/keltiawave-ci.env
          sed -i 's#^MODELS_DIR=.*#MODELS_DIR=/tmp/keltiawave-ci-models#' /tmp/keltiawave-ci.env

      - name: Validate local Compose
        env:
          POSTGRES_USER: ci-user
          POSTGRES_PASSWORD: ci-postgres-password
          MINIO_ROOT_USER: ci-minio
          MINIO_ROOT_PASSWORD: ci-minio-password
          SECRET_KEY: ci-only-secret-key
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Validate OVH candidate Compose
        run: docker compose --env-file /tmp/keltiawave-ci.env -f deploy/ovh/docker-compose.candidate.yml config --quiet

      - name: Verify deployment remains a dry run by default
        run: |
          output="$(./scripts/deploy-ovh.sh)"
          grep -q "DRY RUN" <<<"$output"
          grep -q "No SSH command was executed" <<<"$output"
